# How much thrust can one motor lose before the hold requirements fail?
name: motor_loss_sweep
scenario: ../scenarios/motor_degraded.yaml
runs: 200
seed: 2000
dispersions:
  faults[0].motor:   {dist: choice, values: [0, 1, 2, 3]}
  faults[0].factor:  {dist: uniform, low: 0.35, high: 1.0}
  faults[0].t_s:     {dist: uniform, low: 25.0, high: 45.0}
  wind.north_mps:    {dist: uniform, low: -4.0, high: 4.0}
  wind.east_mps:     {dist: uniform, low: -4.0, high: 4.0}
