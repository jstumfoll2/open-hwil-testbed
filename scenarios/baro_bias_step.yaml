# The barometer jumps by +0.6 hPa (reads about 5 m low) mid-hold.
name: baro_bias_step
description: Take off to 20 m and hold 60 s; at 40 s the baro gains a +0.6 hPa bias; then land.
seed: 8
sim: {duration_s: 150}
mission:
  - {type: takeoff, alt_m: 20.0}
  - {type: hold, duration_s: 60.0}
  - {type: land}
faults:
  - {type: baro_bias, bias_hpa: 0.6, t_s: 40.0}
requirements:
  - id: REQ-BARO-001
    text: After the bias step, true altitude stays within 5.5 m of the commanded altitude while loitering.
    stl: "always((loiter > 0) -> (abs(alt_err_m) <= 5.5))"
  - id: REQ-BARO-002
    text: The vehicle never descends below 10 m while loitering.
    stl: "always((loiter > 0) -> (alt_m >= 10.0))"
  - id: REQ-LAND-014
    text: The vehicle lands and disarms within 3 m of home.
    stl: "eventually((landed > 0) and (hdist_m <= 3.0))"
