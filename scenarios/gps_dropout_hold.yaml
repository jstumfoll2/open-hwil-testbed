# A 10 s GPS outage while holding position.
name: gps_dropout_hold
description: Take off to 20 m and hold 60 s; GPS reports no fix from 40 s to 50 s; then land.
seed: 7
sim: {duration_s: 150}
wind: {north_mps: 1.5, east_mps: 1.0, turbulence_severity: 1}
mission:
  - {type: takeoff, alt_m: 20.0}
  - {type: hold, duration_s: 60.0}
  - {type: land}
faults:
  - {type: gps_dropout, t_s: 40.0, duration_s: 10.0}
requirements:
  - id: REQ-GPS-001
    text: Through the outage, altitude stays within 5 m of the commanded altitude while loitering.
    stl: "always((loiter > 0) -> (abs(alt_err_m) <= 5.0))"
  - id: REQ-GPS-002
    text: The vehicle never drifts more than 10 m horizontally from home.
    stl: "always(hdist_m <= 10.0)"
  - id: REQ-GPS-003
    text: Tilt never exceeds 25 degrees.
    stl: "always(tilt_deg <= 25.0)"
  - id: REQ-LAND-013
    text: The vehicle lands and disarms within 10 m of home.
    stl: "eventually((landed > 0) and (hdist_m <= 10.0))"
